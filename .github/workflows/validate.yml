name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # skills-ref: Agent Skills reference validator, pinned to an agentskills/agentskills commit
          python -m pip install \
            "pyyaml==6.0.3" \
            "skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"

      - name: Repository checks (scripts/validate.py)
        run: python scripts/validate.py

      - name: Agent Skills reference validator (skills-ref)
        run: |
          status=0
          for d in skills/*/; do
            skills-ref validate "$d" || status=1
          done
          exit $status
